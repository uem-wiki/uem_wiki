<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>应大 Wiki · 测试版本入口</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body { background: #f7f3ec; color: #2f2a24; font-family: system-ui, sans-serif; }
    .toolbar { position: fixed; z-index: 2; top: 0; left: 0; right: 0; height: 48px; display: flex; align-items: center; gap: 16px; padding: 0 20px; background: rgba(255,255,255,.94); border-bottom: 1px solid #ddd5ca; }
    .toolbar a { color: inherit; }
    .toolbar strong { margin-right: auto; }
    main { min-height: 100%; padding: 72px 24px 40px; }
    .placeholder { max-width: 960px; margin: 12vh auto 0; padding: 56px 32px; text-align: center; border: 1px dashed #b9ab9b; border-radius: 16px; }
    .placeholder h1 { margin: 0 0 12px; font-size: clamp(32px, 6vw, 64px); }
    .placeholder p { margin: 8px 0; color: #74695e; }
    .actions { display: flex; justify-content: center; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
    .actions a { display: inline-block; padding: 10px 18px; border-radius: 999px; background: #75634f; color: white; text-decoration: none; }
    .actions a.secondary { background: transparent; color: #75634f; border: 1px solid #b9ab9b; }
  </style>
</head>
<body>
  <nav class="toolbar">
    <strong>应大 Wiki · 测试版本入口</strong>
  </nav>
  <main>
    <section class="placeholder">
      <h1>测试版本</h1>
      <p>VitePress 测试版本使用独立开发服务器预览。</p>
      <div class="actions">
        <a href="https://uem-wiki-test.linyuxia838.workers.dev/" target="_blank" rel="noopener">打开 VitePress 测试版</a>
      </div>
      <p>如果在 Codespaces 中打开，请在 Ports 面板转发 <code>5173</code> 后访问对应地址。</p>
    </section>
  </main>
</body>
</html>
