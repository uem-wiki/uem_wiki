<style data-page-style>
/* ===== 博客卡片（sync时被剥离，手动恢复） ===== */
.link-section { margin-bottom: 40px; }
.link-section h2 {
  font-family: var(--font-serif); font-size: 20px; font-weight: 700;
  margin-bottom: 16px; color: var(--ink);
  padding-bottom: 8px; border-bottom: 1px solid var(--border);
}
.link-section h2::before { content: none; }
.link-grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}
.link-card {
  border: 1px solid var(--border); border-radius: 8px;
  padding: 16px; text-decoration: none; color: inherit;
  transition: all 0.2s; background: var(--color-surface);
  display: block;
}
.link-card:hover {
  border-color: var(--ink); box-shadow: 0 4px 12px var(--color-shadow);
  transform: translateY(-2px);
}
.link-card .name { font-weight: 600; font-size: 15px; margin-bottom: 6px; color: var(--ink); }
.link-card .desc { font-size: 13px; color: var(--ink-faint); line-height: 1.5; }
.link-card .url { font-size: 12px; color: var(--link); margin-top: 8px; word-break: break-all; }
.link-card.avatar-card { display: flex; align-items: center; gap: 14px; min-height: 168px; position: relative; }
.link-card.avatar-card .meta { font-size: 12px; color: var(--ink-faint); margin-top: 2px; }
.link-card.avatar-card .card-info { flex: 1; min-width: 0; }
.link-card.avatar-card .card-avatar {
  width: 44px; height: 44px; border-radius: 50%;
  object-fit: cover; border: 1px solid var(--border);
  flex-shrink: 0; position: relative; z-index: 1; transform: translateY(-10px);
}
.link-card.avatar-card .card-avatar-wrap { display: flex; flex-direction: column; align-items: center; gap: 12px; flex-shrink: 0; }
.gh-link { display: inline-flex; align-items: center; justify-content: center; color: var(--ink-faint); cursor: pointer; line-height: 0; transition: color .15s; }
.gh-link:hover { color: var(--color-text); }
.link-card.avatar-card .url { display: flex; align-items: center; justify-content: flex-start; gap: 6px; }
.link-card.avatar-card .url-copy { cursor: pointer; }
.link-card.avatar-card .url-copy:hover { color: var(--vermilion); }

/* ===== 页面专属样式（sync时被剥离，手动恢复） ===== */
.breadcrumb {
  font-size: 13px; color: var(--ink-faint); margin-bottom: 16px;
  font-family: var(--font-serif);
}
.breadcrumb a {
  color: var(--ink-faint) !important; text-decoration: none !important;
  border-bottom: none !important;
}
.breadcrumb a:hover { color: var(--vermilion) !important; }
.breadcrumb span { margin: 0 6px; }
.join-banner { display: flex; align-items: center; gap: 10px; background: var(--paper-dark); border: 1px solid var(--border); border-left: 4px solid var(--vermilion); border-radius: 6px; padding: 12px 16px; margin: 16px 0 22px; text-decoration: none !important; color: var(--ink) !important; transition: background .2s, box-shadow .2s, transform .2s; }
.join-banner:hover { background: var(--paper); box-shadow: 0 2px 10px var(--color-shadow); transform: translateY(-1px); border-left-color: var(--vermilion-light); }
.join-banner .join-emoji { font-size: 18px; flex-shrink: 0; line-height: 1; }
.join-banner .join-text { font-size: 14px; line-height: 1.5; }
