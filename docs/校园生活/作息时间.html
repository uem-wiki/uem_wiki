<h2>说明</h2>
<ul>
<li>每年<strong>"五一"</strong>起执行夏季作息，<strong>"十一"</strong>起执行冬季作息</li>
<li>上午（第 1-4 节）冬夏相同；下午及晚间（第 5-10 节）夏季比冬季晚 30 分钟</li>
<li>晚间第 9、10 节原则上为课外实践活动、校通识类选修课及实验课时间</li>
