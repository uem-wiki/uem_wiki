<h1>晚自习</h1>
<blockquote>
<p>大一期间的集体学习时间，合理安排晚间学习</p>
</blockquote>
<h2>基本规则</h2>
<ul>
<li><strong>仅大一</strong>有晚自习，大二及以上年级无需参加</li>
<li>次日是<strong>工作日</strong>（周一至周五）→ 当天有晚自习（第九、十节课）</li>
<li>次日是<strong>休息日</strong>（周六、周日）→ 不上晚自习</li>
</ul>
<h2>晚修与晚自习冲突</h2>
<p>如晚修与晚自习时间冲突，<strong>优先上晚修</strong>，晚自习不算缺勤。</p>
<h2>Edge：免参加晚自习</h2>
<p>如果不想参加集体晚自习，可以加入面向本科生的<strong>实验室/兴趣小组</strong>，出具由实验室开具的请假条后，可以不参与集体晚自习。</p>
